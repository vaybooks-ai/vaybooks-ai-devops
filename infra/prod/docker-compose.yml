version: '3.8'

# PLACEHOLDER for Production Environment
# This will be configured when deploying to AWS/production

services:
  postgres:
    image: postgres:15-alpine
    container_name: vaybooks-postgres-prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # TODO: Configure RDS or managed PostgreSQL
    # TODO: Configure automated backups
    # TODO: Configure replication
    networks:
      - vaybooks-network

  backend-api:
    image: vaybooks-backend-api:latest
    container_name: vaybooks-backend-api-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_TYPE: S3
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    # TODO: Configure auto-scaling
    # TODO: Configure load balancer
    # TODO: Configure monitoring & alerting
    # TODO: Configure resource limits
    depends_on:
      - postgres
    networks:
      - vaybooks-network
    restart: always

  backend-worker:
    image: vaybooks-backend-worker:latest
    container_name: vaybooks-backend-worker-prod
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      STORAGE_TYPE: S3
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      AWS_REGION: ${AWS_REGION}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    # TODO: Configure auto-scaling for workers
    depends_on:
      - postgres
    networks:
      - vaybooks-network
    restart: always

  frontend:
    image: vaybooks-frontend:latest
    container_name: vaybooks-frontend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL}
    # TODO: Configure CDN (CloudFront)
    # TODO: Configure SSL/TLS certificates
    # TODO: Configure caching strategy
    depends_on:
      - backend-api
    networks:
      - vaybooks-network
    restart: always

networks:
  vaybooks-network:
    driver: bridge
