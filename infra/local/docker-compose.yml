version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: vaybooks-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-vaybooks}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-vaybooks_dev}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-vaybooks}
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaybooks-network

  backend-api:
    build:
      context: ../../../vaybooks-ai-backend-core
      dockerfile: Dockerfile.api
    container_name: vaybooks-backend-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-vaybooks}:${MONGO_ROOT_PASSWORD:-vaybooks_dev}@mongodb:27017/${MONGO_DATABASE:-vaybooks}?authSource=admin
      MONGODB_DATABASE: ${MONGO_DATABASE:-vaybooks}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-min-256-bits}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      STORAGE_TYPE: LOCAL
      STORAGE_LOCAL_PATH: /data/uploads
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./volumes/uploads:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vaybooks-network
    restart: unless-stopped

  backend-worker:
    build:
      context: ../../../vaybooks-ai-backend-core
      dockerfile: Dockerfile.worker
    container_name: vaybooks-backend-worker
    environment:
      SPRING_PROFILES_ACTIVE: local
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-vaybooks}:${MONGO_ROOT_PASSWORD:-vaybooks_dev}@mongodb:27017/${MONGO_DATABASE:-vaybooks}?authSource=admin
      MONGODB_DATABASE: ${MONGO_DATABASE:-vaybooks}
      STORAGE_TYPE: LOCAL
      STORAGE_LOCAL_PATH: /data/uploads
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    ports:
      - "5006:5006"
    volumes:
      - ./volumes/uploads:/data/uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - vaybooks-network
    restart: unless-stopped

  frontend:
    build:
      context: ../../../vaybooks-ai-frontend
      dockerfile: Dockerfile
      target: development
    container_name: vaybooks-frontend
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_APP_NAME: VayBooks AI
    ports:
      - "5173:5173"
    volumes:
      - ../../../vaybooks-ai-frontend/src:/app/src
      - ../../../vaybooks-ai-frontend/public:/app/public
    depends_on:
      - backend-api
    networks:
      - vaybooks-network
    restart: unless-stopped

networks:
  vaybooks-network:
    driver: bridge

volumes:
  mongodb-data:
  uploads:
