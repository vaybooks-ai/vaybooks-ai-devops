version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vaybooks-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vaybooks}
      POSTGRES_USER: ${POSTGRES_USER:-vaybooks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vaybooks_dev}
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vaybooks}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vaybooks-network

  backend-api:
    build:
      context: ../../../vaybooks-ai-backend-core
      dockerfile: Dockerfile.api
    container_name: vaybooks-backend-api
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vaybooks}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vaybooks}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vaybooks_dev}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production-min-256-bits}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      STORAGE_TYPE: LOCAL
      STORAGE_LOCAL_PATH: /data/uploads
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "8080:8080"
      - "5005:5005"
    volumes:
      - ./volumes/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vaybooks-network
    restart: unless-stopped

  backend-worker:
    build:
      context: ../../../vaybooks-ai-backend-core
      dockerfile: Dockerfile.worker
    container_name: vaybooks-backend-worker
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-vaybooks}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-vaybooks}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-vaybooks_dev}
      STORAGE_TYPE: LOCAL
      STORAGE_LOCAL_PATH: /data/uploads
      AI_PROVIDER: ${AI_PROVIDER:-OPENAI}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4}
      WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-5000}
      WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-10}
      JAVA_TOOL_OPTIONS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5006"
    ports:
      - "5006:5006"
    volumes:
      - ./volumes/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vaybooks-network
    restart: unless-stopped

  frontend:
    build:
      context: ../../../vaybooks-ai-frontend
      dockerfile: Dockerfile
    container_name: vaybooks-frontend
    environment:
      VITE_API_URL: http://localhost:8080
      VITE_APP_NAME: VayBooks AI
    ports:
      - "5173:5173"
    volumes:
      - ../../../vaybooks-ai-frontend/src:/app/src
      - ../../../vaybooks-ai-frontend/public:/app/public
    depends_on:
      - backend-api
    networks:
      - vaybooks-network
    restart: unless-stopped

networks:
  vaybooks-network:
    driver: bridge

volumes:
  postgres-data:
  uploads:
